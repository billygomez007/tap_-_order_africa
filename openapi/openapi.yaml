openapi: 3.1.0
info:
  title: Tap & Order Africa API
  version: 0.1.0
  description: Initial contract for the Ghana Mobility MVP.
servers:
  - url: https://api.example.invalid/v1
    description: Placeholder until deployment architecture is finalized
tags:
  - name: Auth
  - name: Mobility
  - name: Bookings
  - name: Payments
  - name: Tracking
paths:
  /auth/otp/request:
    post:
      tags: [Auth]
      summary: Request Ghana phone OTP
      responses:
        '202': { description: Accepted }
        '429': { description: Too many requests }
  /auth/otp/verify:
    post:
      tags: [Auth]
      summary: Verify OTP
      responses:
        '200': { description: Authenticated }
        '400': { description: Invalid request }
  /mobility/routes:
    get:
      tags: [Mobility]
      summary: Search directional routes
      responses:
        '200': { description: Route results }
  /mobility/routes/{routeId}/stops:
    get:
      tags: [Mobility]
      summary: List designated route stops
      parameters:
        - { name: routeId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Ordered stops }
  /mobility/trips:
    get:
      tags: [Mobility]
      summary: Discover scheduled/live eligible trips
      responses:
        '200': { description: Eligible trips }
  /mobility/trips/{tripId}/seat-availability:
    get:
      tags: [Mobility]
      summary: Calculate segment-aware seat availability
      parameters:
        - { name: tripId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: pickupStopId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: dropoffStopId, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Availability }
  /bookings:
    post:
      tags: [Bookings]
      summary: Create booking attempt
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      responses:
        '201': { description: Booking created }
        '409': { description: Seat conflict or invalid transition }
  /bookings/{bookingId}:
    get:
      tags: [Bookings]
      summary: Read authoritative booking state
      parameters:
        - { name: bookingId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Booking }
  /bookings/{bookingId}/cancel:
    post:
      tags: [Bookings]
      summary: Cancel booking under policy
      parameters:
        - { name: bookingId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      responses:
        '200': { description: Cancellation result }
  /payments/intents:
    post:
      tags: [Payments]
      summary: Create provider-neutral payment intent
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      responses:
        '201': { description: Payment intent }
  /tracking/trips/{tripId}/location:
    post:
      tags: [Tracking]
      summary: Submit authorized driver location sample
      parameters:
        - { name: tripId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '202': { description: Accepted }
  /tracking/bookings/{bookingId}:
    get:
      tags: [Tracking]
      summary: Read journey-relevant tracking
      parameters:
        - { name: bookingId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Tracking view }
